# Builds the ISO on GitHub's runner, and keeps it as a workflow artifact for 30 days.
# Every morning it looks first: only when eznix's main or ezinstall's main is at another
# commit than the newest release was built from is anything built (the user's rule,
# 2026-10-26: the templates the ISO installs have flake.locks of their own, so a newer
# nixpkgs alone is no reason for a new ISO). Run by hand (Actions, "Build ISO", Run
# workflow) it always builds. On main it then makes a release of it, tagged with the
# date and titled with eznix's commit, unless the ISO is identical to the newest
# release's; the three newest releases are kept. A release is never changed once made:
# releases/latest/download/ezinstall.iso is always the newest ISO.
# Run by hand it can build the test ISO instead (eznix-iso-develop: eznix's and
# ezsetup's develop branches), which is kept as an artifact and never released.
name: Build ISO

on:
  schedule:
    # Off the hour: GitHub drops scheduled runs on the hour more often when busy.
    - cron: '17 4 * * *'
  workflow_dispatch:
    inputs:
      iso:
        description: Which ISO to build
        type: choice
        options:
          - eznix-iso
          - eznix-iso-develop
        default: eznix-iso

permissions:
  contents: write

jobs:
  iso:
    runs-on: ubuntu-latest
    env:
      # A scheduled run has no inputs, and builds the normal ISO.
      ISO: ${{ inputs.iso || 'eznix-iso' }}
    timeout-minutes: 300
    steps:
      - name: Find eznix's commit
        id: commits
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "eznix=$(gh api repos/kalken/eznix/commits/main --jq .sha)" >> "$GITHUB_OUTPUT"

      # Commits whose build gave an ISO identical to the newest release's are not
      # released, and are remembered as an entry in the Actions cache instead (saved at
      # the end), or every morning would build them again. GitHub drops an entry unused
      # for a week; then they are built once more, to the same end.
      - name: Commits already built
        id: seen
        uses: actions/cache/restore@v4
        with:
          path: .built
          key: built-${{ steps.commits.outputs.eznix }}-${{ github.sha }}
          lookup-only: true

      # The commits the newest release was built from are in its notes, as the lines
      # "eznix: SHA" and "ezinstall: SHA". A release without them counts as changed.
      - name: Look for changes
        id: look
        env:
          GH_TOKEN: ${{ github.token }}
          EZNIX: ${{ steps.commits.outputs.eznix }}
          SEEN: ${{ steps.seen.outputs.cache-hit }}
        run: |
          echo "eznix=$EZNIX" >> "$GITHUB_OUTPUT"
          notes=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .body 2>/dev/null | tr -d '\r' || true)
          if [ "$GITHUB_EVENT_NAME" = schedule ] && { [ "$SEEN" = true ] || {
              printf '%s\n' "$notes" | grep -qx "eznix: $EZNIX" \
              && printf '%s\n' "$notes" | grep -qx "ezinstall: $GITHUB_SHA"; }; }; then
            echo "eznix and ezinstall are as already built; nothing built"
            echo "Unchanged: nothing built" >> "$GITHUB_STEP_SUMMARY"
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      # The runner has about 20-30 GB free; the Nix store and the ISO come close.
      - name: Free disk space
        if: steps.look.outputs.build == 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force || true
          df -h /

      - uses: actions/checkout@v4
        if: steps.look.outputs.build == 'true'

      - uses: cachix/install-nix-action@v31
        if: steps.look.outputs.build == 'true'

      # No flake.lock in the repository: this takes nixpkgs 26.05 as it is now, and eznix
      # at the commit looked at above (develop as it is now, for the test ISO), so the
      # release says which eznix it holds even if main moves during the build.
      - name: Build
        if: steps.look.outputs.build == 'true'
        env:
          EZNIX: ${{ steps.look.outputs.eznix }}
        run: |
          pin=()
          if [ "$ISO" = eznix-iso ]; then pin=(--override-input eznix "github:kalken/eznix/$EZNIX"); fi
          nix build --no-write-lock-file --print-build-logs "${pin[@]}" ".#nixosConfigurations.$ISO.config.system.build.isoImage"

      # 2 GiB is GitHub's limit for a release file; the ISO is kept under it.
      - name: Check size
        if: steps.look.outputs.build == 'true'
        run: |
          iso=$(echo result/iso/*.iso)
          size=$(stat -L -c %s "$iso")
          echo "$(basename "$iso"): $((size / 1048576)) MiB"
          echo "ISO: $((size / 1048576)) MiB" >> "$GITHUB_STEP_SUMMARY"
          if [ "$size" -ge $((2048 * 1048576)) ]; then
            echo "::error::The ISO is over 2 GiB, GitHub's limit for a release file"
            exit 1
          fi
          cp -L "$iso" ezinstall.iso

      # The ISO is already compressed; zipping it again only costs time.
      - uses: actions/upload-artifact@v4
        if: steps.look.outputs.build == 'true'
        with:
          name: ${{ env.ISO == 'eznix-iso' && 'ezinstall-iso' || 'ezinstall-iso-develop' }}
          path: ezinstall.iso
          compression-level: 0
          retention-days: 30

      # Only after the build and the size check passed, so a failed build changes no
      # release. A release is one version: its tag, its commit and its ISO are never
      # changed afterwards (until 2026-10-26 one release, "latest", had its ISO replaced
      # and its tag moved, and its dates said nothing about the ISO it held). An ISO
      # identical to the newest release's is no new release (the user's word: a change
      # that does not reach the ISO, a README say, is no new version); its commits are
      # remembered below. GitHub shows the checksum of every release file, so there is no
      # .sha256 file beside it.
      - name: Release
        id: release
        if: steps.look.outputs.build == 'true' && github.ref == 'refs/heads/main' && env.ISO == 'eznix-iso'
        env:
          GH_TOKEN: ${{ github.token }}
          EZNIX: ${{ steps.look.outputs.eznix }}
        run: |
          sum="sha256:$(sha256sum ezinstall.iso | cut -d' ' -f1)"
          released=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" \
            --jq '.assets[] | select(.name == "ezinstall.iso") | .digest' 2>/dev/null || true)
          if [ "$sum" = "$released" ]; then
            echo "The ISO is the newest release's; nothing released"
            echo "Identical ISO: not released" >> "$GITHUB_STEP_SUMMARY"
            echo "identical=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The date, and the run's number on a second release the same day.
          tag=$(date -u +%F)
          if gh release view "$tag" >/dev/null 2>&1; then tag="$tag.$GITHUB_RUN_NUMBER"; fi
          gh release create "$tag" ezinstall.iso --target "$GITHUB_SHA" --latest \
            --title "ezinstall $tag (eznix ${EZNIX:0:7})" \
            --notes "$(printf 'eznix: %s\nezinstall: %s\n\nChecksum: `%s`' "$EZNIX" "$GITHUB_SHA" "$sum")"
          echo "Released: $tag" >> "$GITHUB_STEP_SUMMARY"
          # Three are kept, so a broken ISO can be gone back from; the rest go with their tags.
          gh release list --limit 100 --json tagName,createdAt \
            --jq 'sort_by(.createdAt) | reverse | .[3:] | .[].tagName' |
            while read -r old; do gh release delete "$old" --yes --cleanup-tag; done
          df -h /

      - name: Remember the commits
        if: steps.release.outputs.identical == 'true'
        run: touch .built

      - uses: actions/cache/save@v4
        if: steps.release.outputs.identical == 'true'
        with:
          path: .built
          key: built-${{ steps.look.outputs.eznix }}-${{ github.sha }}
