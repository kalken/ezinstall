# Builds the ISO on GitHub's runner every Monday, or by hand (Actions, "Build ISO",
# Run workflow), and keeps it as a workflow artifact for 30 days. On main it also
# replaces the ISO on the one release called "latest", unless it is the same ISO;
# there is no release history.
# Run by hand it can build the test ISO instead (eznix-iso-develop: eznix's and
# ezsetup's develop branches), which is kept as an artifact and never released.
name: Build ISO

on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:
    inputs:
      iso:
        description: Which ISO to build
        type: choice
        options:
          - eznix-iso
          - eznix-iso-develop
        default: eznix-iso

permissions:
  contents: write

jobs:
  iso:
    runs-on: ubuntu-latest
    env:
      # A scheduled run has no inputs, and builds the normal ISO.
      ISO: ${{ inputs.iso || 'eznix-iso' }}
    timeout-minutes: 300
    steps:
      # The runner has about 20-30 GB free; the Nix store and the ISO come close.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force || true
          df -h /

      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31

      # No flake.lock in the repository: this takes nixpkgs 26.05 and eznix's main (or
      # develop, for the test ISO) as they are now.
      - name: Build
        run: nix build --no-write-lock-file --print-build-logs ".#nixosConfigurations.$ISO.config.system.build.isoImage"

      # 2 GiB is GitHub's limit for a release file; the ISO is kept under it.
      - name: Check size
        run: |
          iso=$(echo result/iso/*.iso)
          size=$(stat -L -c %s "$iso")
          echo "$(basename "$iso"): $((size / 1048576)) MiB"
          echo "ISO: $((size / 1048576)) MiB" >> "$GITHUB_STEP_SUMMARY"
          if [ "$size" -ge $((2048 * 1048576)) ]; then
            echo "::error::The ISO is over 2 GiB, GitHub's limit for a release file"
            exit 1
          fi
          cp -L "$iso" ezinstall.iso
          sha256sum ezinstall.iso > ezinstall.iso.sha256

      # The ISO is already compressed; zipping it again only costs time.
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ISO == 'eznix-iso' && 'ezinstall-iso' || 'ezinstall-iso-develop' }}
          path: ezinstall.iso
          compression-level: 0
          retention-days: 30

      # Only after the build and the size check passed, so a failed build leaves the
      # old release as it was. The fixed file name is what lets --clobber replace it.
      # An ISO with the checksum of the one already released is not uploaded again, and
      # the release keeps its date.
      - name: Publish to the latest release
        if: github.ref == 'refs/heads/main' && env.ISO == 'eznix-iso'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest || gh release create latest --target "$GITHUB_SHA" --title "Latest ISO" --notes "Built weekly"
          # The release's "Source code" downloads are GitHub's, made from the commit its tag
          # points at: move the tag to the commit this ISO was built from, so they match it.
          # Also when the ISO is unchanged, since the source may have changed all the same.
          git tag -f latest "$GITHUB_SHA"
          git push --force origin refs/tags/latest
          if gh release download latest --pattern ezinstall.iso.sha256 --output released.sha256 --clobber \
              && cmp -s released.sha256 ezinstall.iso.sha256; then
            echo "The ISO is the one already released; nothing published"
            echo "Unchanged: not published" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh release upload latest ezinstall.iso ezinstall.iso.sha256 --clobber
          gh release edit latest --notes "Built $(date -u +%F) from main"
          df -h /
